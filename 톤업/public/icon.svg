<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Deep Indigo to Electric Violet -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <!-- Accent Gradient for Pen -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Smooth Ambient Soft Edge Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

  <!-- Inner Content with Shadow -->
  <g filter="url(#shadow)">
    <!-- Speech Bubble representing conversation and tones -->
    <path d="M140 180h232c22 0 40 18 40 40v120c0 22-18 40-40 40H220l-60 50v-50h-20c-22 0-40-18-40-40V220c0-22 18-40 40-40z" fill="#ffffff" />
    
    <!-- Modern Chat Lines representing refined professional business writing (translation/tone-conversion) -->
    <rect x="170" y="225" width="130" height="12" rx="6" fill="#6366f1" />
    <rect x="170" y="255" width="170" height="12" rx="6" fill="#818cf8" />
    <rect x="170" y="285" width="100" height="12" rx="6" fill="#c7d2fe" />
    
    <!-- Dynamic Elegant Translation/Tone Pen icon overlapping -->
    <path d="M320 310l60-60 15 15-60 60z" fill="url(#accent-grad)" />
    <path d="M380 250l10-10c5-5 13-5 18 0l2 2c5 5 5 13 0 18l-10 10z" fill="#f43f5e" />
    <path d="M320 310l-5 15 15-5z" fill="#312e81" />
  </g>
</svg>
